<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="cien cien1"></div>
    <div class="cien cien2"></div>
    <div class="cien-v2 cien3"></div>
    <header>
        <p class="nazwa">Nexo<span class="kolor">Host</span></p>
        <div class="navbar">
            <a class="przyciski" href="../index.html">STRONA GŁÓWNA</a>
            <a class="przyciski" href="oferty.html">OFERTY</a>
            <a class="przyciski" href="napisz.html">KONTAKT</a>
        </div>
    </header>
    <main>
        <div class="kontakt-kategoria">
            <div class="panele">

                <p class="tekst-skontaktuj">
                    <b>Skontaktuj się</b> z nami
                </p>
                <p class="tekst-informacja">
                    Masz pytania dotyczące hostingu lub oferty? Skontaktuj <br>
                    się z nami za pomocą jednego z poniższych sposobów.
                </p>

                
                    <button class="kontakt-discord">
                        <div class="panel">

                            <div>
                            <img class="ikona" src="../assets/icons8-discord-50.png" alt="">
                            </div>

                            <div class="opis-panelu">
                                <p class="nasze-community">
                                Dołącz do naszego community
                                </p>
                                <p class="nasza-spolecznosc">
                                Discord społeczność Nexo
                                </p>
                            </div>

                        </div>
                        
                        
                    </button>
                
            </div>
        <div class="napisz-wiadomosc">
            
            <div class="kontakt">

                <p class="pytanie">Imię</p>

                <div class="kafelek">
                    <input type="Name" placeholder="Twoje imię">
                </div>
                
            </div>
            
            <div class="kontakt">

                <p class="pytanie">Adres e-mail</p>

                <div class="kafelek">
                    <input type="Email" placeholder="Twój adres e-mail">
                </div>
                
            </div>
            
            <div class="kontakt">

                <p class="pytanie">Temat wiadomości</p>

                <div class="kafelek">
                    <input type="text" placeholder="Z jakim tematem do nas piszesz?">
                </div>
                
            </div>
            
            <div class="kontakt">

                <p class="pytanie">Wiadomość do nas</p>

                <div class="kafelek">
                    <textarea name="Wiadomosc" id="Wiadomosc" placeholder="Wpisz swoją wiadomość..."></textarea>
                </div>
                
            </div>
        
                <button class="submit">Wyślij Wiadomość</button>
                       
        </div>     
        </div>
        
    </main>
</body>
</html>
