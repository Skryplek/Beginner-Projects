<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandyRP</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">

            <div>
                <img class="logo" src="assets/LOGO-CANDY.png" alt="logo candyrp">
            </div>

            <div class="navbar-buttons">
                <a href="" class="under-page-button">Strona główna</a>
                <a href="" class="under-page-button">SOON</a>
                <a href="" class="under-page-button">SOON</a>
            </div>

            <div>
                <button class="button-join">Połącz</button>
            </div>

        </nav>
    </header>
    <div class="circle-shadow flash-1"></div>
    <div class="circle-shadow flash-2"></div>
    <div class="circle-shadow flash-3"></div>
    <main>
        
        <div class="cards-owner-candyrp">
            
            <div class="card-owner">
                <img class="logo-owner" src="assets/LOGO-TEDDY.png" alt="Logo ownera teddy">
                <div>

                    <div>
                        <p class="owner">Teddy</p>
                    </div>
                    <div>
                        <p class="orange rank">OWNER</p>
                    </div>

                </div>
                <div class="circle-owner"></div>
            </div>

            <div class="card-owner">
                <img class="logo-owner" src="assets/LOGO-NEXU.png" alt="Logo ownera teddy">
                <div>

                    <div>
                        <p class="owner">Nexu</p>
                    </div>
                    <div>
                        <p class="orange rank">OWNER</p>
                    </div>

                </div>
                <div class="circle-owner"></div>
            </div>

            <div class="card-owner">
                <img class="logo-owner" src="assets/LOGO-SKUBI.png" alt="Logo ownera teddy">
                <div>

                    <div>
                        <p class="owner">Skubi</p>
                    </div>
                    <div>
                        <p class="orange rank">C-OWNER</p>
                    </div>

                </div>
                <div class="circle-owner"></div>
            </div>
        </div>
    </main>
</body>
</html>
